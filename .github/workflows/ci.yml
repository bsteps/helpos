name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# Cancel an older run when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, test
    # Draft PRs skip CI. It runs once the PR is marked ready for review.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety). Dependabot keeps them updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave a token on disk for later steps
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision pinned API comparison tool
        run: node scripts/setup-oasdiff.mjs
      - name: Compare API contract to the actual PR base
        if: github.event_name == 'pull_request'
        run: node scripts/api-compatibility.mjs --event "$GITHUB_EVENT_PATH"
      - run: pnpm exec biome ci .
      # Unused files, exports and dependencies (knip.jsonc).
      - run: pnpm knip
      - name: Unit tests with Docker stopped
        run: |
          sudo systemctl stop docker.socket docker.service
          trap 'sudo systemctl start docker.socket docker.service' EXIT
          for unit in docker.service docker.socket; do
            state=$(systemctl show "$unit" --property=ActiveState --value)
            echo "$unit: $state"
            test "$state" = inactive
          done
          if docker info >/dev/null 2>&1; then
            echo "Docker is still reachable"
            exit 1
          fi
          pnpm exec vitest run --project unit
      - run: pnpm exec turbo run typecheck build
      - run: pnpm test:coverage
      - run: pnpm check:widget
      - run: pnpm test:performance
      - name: Upload coverage and read latency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gate-evidence
          path: |
            coverage/
            .helpos/read-budget.json
          include-hidden-files: true
          retention-days: 7
      - run: pnpm test:scripts
      # AI evals against the mock model. CI never calls a real provider (EVAL_LIVE is never set here).
      - run: pnpm eval
      # Proves the one-command local setup works from a fresh clone (issue #5).
      # Tests above already use real Postgres via Testcontainers (ADR 0005).
      - name: Smoke test `pnpm dev`
        run: |
          pnpm dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/readyz; then exit 0; fi
            sleep 2
          done
          cat dev.log
          exit 1

  e2e:
    name: End-to-end (Playwright)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @helpos/web exec playwright install --with-deps chromium
      # Builds the dashboard, then runs every flow at laptop and phone size against a real
      # server with throwaway Postgres and Mailpit containers (apps/server/src/e2e/serve.ts).
      - run: pnpm test:e2e
      - name: Upload failure traces, screenshots and videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  demo:
    name: Demo deployment (compose)
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The compose file is valid, and no .env can turn shadow mode off on the demo.
      - run: pnpm demo:check
      # Builds the image and boots the real stack: migrate, create a workspace, receive an
      # email through the webhook, write a backup (scripts/smoke-demo.sh).
      - run: bash scripts/smoke-demo.sh
