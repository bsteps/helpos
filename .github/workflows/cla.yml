name: CLA

# Asks first-time contributors to sign CLA.md by commenting on their PR.
# Signatures are stored on the `cla-signatures` branch, so `main` stays protected.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # pinned to a commit SHA for supply-chain safety (v2.6.1)
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/bsteps/helpos/blob/main/CLA.md
          branch: cla-signatures
          allowlist: bsteps,dependabot[bot]
