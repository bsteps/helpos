name: "AI check: Test signal"

# Asks only for fewer or better tests, never for more coverage. Flags sleeps, fixed timeouts and retries.
# Narrow, advisory AI review (issue #111). The shared steps and the security notes are in
# ai-check.yml; the skill is .claude/skills/test-signal-check, the rules docs/checks/test-signal.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Only code this check is about. Docs-only PRs never start it.
    paths:
      - "**/*.test.ts"
      - "**/*.test.tsx"
      - "**/*.test.mjs"
      - "**/*.spec.ts"
      - "apps/web/e2e/**"
      - "apps/server/src/e2e/**"
      - "packages/ai/evals/**"
      - "packages/ai/src/evals/**"
      - "fixtures/**"
      - "**/vitest.config.*"
      - "**/playwright.config.*"

permissions: {}

# One run per PR: a new push cancels the run for the old one.
concurrency:
  group: ai-check-test-signal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    # Maintainers' non-draft PRs from branches in this repo only. Fork PRs get no secrets on
    # pull_request anyway; this also keeps bots and outside authors from spending the budget.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) &&
      github.event.pull_request.user.type == 'User' &&
      !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ai-check.yml
    with:
      check: test-signal
      title: Test signal
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
