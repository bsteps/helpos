name: Dependency review

# Blocks PRs that add dependencies with known vulnerabilities, or with a
# licence that isn't on our AGPL-3.0-compatible allow-list.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave a token on disk for later steps
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, MIT-0, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, Unlicense, Python-2.0,
            MPL-2.0, LGPL-2.1-or-later, LGPL-3.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          # Exact-version exceptions, each checked by hand. Re-check when the version changes.
          # json-schema 0.4.0 (via @ai-sdk/provider): its package.json says "(AFL-2.1 OR BSD-3-Clause)",
          # so we take it under BSD-3-Clause. GitHub's scanner misreads the OR as AND.
          # @fontsource-variable/geist 5.3.0 (dashboard font): OFL-1.1, the standard licence for
          # fonts. The font ships as its own files, unmodified, beside our code, which the OFL allows.
          allow-dependencies-licenses: >-
            pkg:npm/json-schema@0.4.0,
            pkg:npm/%40fontsource-variable/geist@5.3.0
