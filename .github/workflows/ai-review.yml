name: AI review

# Independent AI security review for PRs labelled `security` or `area:db` (issue #42).
# The reviewer is Claude on a different model from the one that writes our code (Opus).
# High or critical findings fail the `AI review result` check. Make that check required.
#
# Security model (pull_request_target runs with secrets, so this matters):
# - The workflow file, prompt, schema and scripts always come from the base branch. The PR's
#   files never touch disk: Claude reads them as git objects with read-only tools. PR code is
#   never installed, built or run, and can't supply agent config (CLAUDE.md, hooks, MCP).
# - Only people with triage rights can add labels, so the label is the maintainer's approval.
# - Fork PRs: the review runs only on the `labeled` event. A new push to a fork PR fails the
#   check until a maintainer re-adds the label after looking at the new commits.
# - Jobs are split so no job holds both the Claude credential and a write token.

on:
  pull_request_target:
    # unlabeled: removing the label clears the required check instead of leaving it red.
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Decide whether to review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      state: ${{ steps.decide.outputs.state }}
    steps:
      - id: decide
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! jq -e 'index("security") or index("area:db")' <<<"$LABELS" >/dev/null; then
            echo "Not labelled security or area:db. No review needed."
            echo "state=skip" >> "$GITHUB_OUTPUT"
          # Fork PRs: only adding one of OUR labels counts as approval, not any label.
          elif [ "$HEAD_REPO" != "$BASE_REPO" ] && ! { [ "$ACTION" = "labeled" ] && { [ "$ADDED_LABEL" = "security" ] || [ "$ADDED_LABEL" = "area:db" ]; }; }; then
            echo "state=stale" >> "$GITHUB_OUTPUT"
          else
            echo "state=review" >> "$GITHUB_OUTPUT"
          fi

  export:
    # Unprivileged: no secrets and a read-only token. This is the ONLY job that touches PR
    # commits, and it never runs them. It only reads git objects and writes plain files.
    name: Export PR content
    needs: gate
    if: needs.gate.outputs.state == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR commits as objects only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" \
            fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          [ "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" ] || { echo "::error::PR head moved, re-run"; exit 1; }
          git cat-file -e "$BASE_SHA"
      # Claude gets no shell (even `git show --output=` can write files). Instead, write the diff
      # and the PR's version of each changed file OUTSIDE the checkout. Blobs only, so symlinks
      # become plain text, and Claude Code never loads config from there (not its cwd).
      - name: Export PR diff and changed files
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr"
          mkdir -p "$out/files"
          git -c core.fsmonitor=false diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > "$out/pr.diff"
          git diff --name-only -z --diff-filter=d "$BASE_SHA...$HEAD_SHA" | while IFS= read -r -d '' f; do
            [ "$(git cat-file -t "$HEAD_SHA:$f")" = blob ] || continue # skip submodules
            mkdir -p "$out/files/$(dirname "$f")"
            git cat-file blob "$HEAD_SHA:$f" > "$out/files/$f"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-pr-content
          path: ${{ runner.temp }}/pr
          include-hidden-files: true
          retention-days: 1

  review:
    name: Claude review
    needs: [gate, export]
    if: needs.gate.outputs.state == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # Privileged job (holds the Claude credential). It never fetches or checks out PR commits.
      # Claude runs in the TRUSTED base checkout, and the PR's content arrives only as plain
      # files outside it. So a PR can't plant CLAUDE.md, .claude/settings.json hooks, .mcp.json
      # or symlinks that Claude Code would load. No denylist to keep up to date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PR content comes from the unprivileged export job, as plain files outside the checkout.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-pr-content
          path: ${{ runner.temp }}/pr
      - name: Build prompt and schema
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          {
            cat .github/ai-review/prompt.md
            printf '\nThe PR range is %s...%s.\n' "$BASE_SHA" "$HEAD_SHA"
            printf 'The full diff is %s/pr/pr.diff. The PR version of each changed file is under %s/pr/files/.\n' "$RUNNER_TEMP" "$RUNNER_TEMP"
          } > "$RUNNER_TEMP/prompt.md"
          {
            echo 'prompt<<PROMPT_EOF'; cat "$RUNNER_TEMP/prompt.md"; echo 'PROMPT_EOF'
            echo "schema=$(jq -c . .github/ai-review/findings.schema.json)"
          } >> "$GITHUB_OUTPUT"
      - id: claude
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          # Set ONE of these secrets. A Claude Pro/Max subscription works: run `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          # A different model from the code author (Opus). Override with the repo variable.
          # Read-only tools: no shell, no edits, no network.
          claude_args: >-
            --model ${{ vars.AI_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --add-dir ${{ runner.temp }}/pr
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.prep.outputs.schema }}'
      - name: Save findings
        shell: bash
        env:
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
        run: printf '%s' "$FINDINGS" > "$RUNNER_TEMP/findings.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-review-findings
          path: ${{ runner.temp }}/findings.json
          retention-days: 7

  report:
    # Make THIS check required in the ruleset. It always runs, so it never stays pending.
    name: AI review result
    needs: [gate, export, review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      STATE: ${{ needs.gate.outputs.state }}
      REVIEW_RESULT: ${{ needs.review.result }}
    steps:
      - name: Skipped or stale
        if: needs.gate.outputs.state != 'review'
        shell: bash
        run: |
          if [ "$STATE" = "skip" ]; then echo "No review needed."; exit 0; fi
          echo "::error::New commits on a fork PR. A maintainer must check them and re-add the label to run the review."
          exit 1
      - name: Review job must have succeeded
        if: needs.gate.outputs.state == 'review' && needs.review.result != 'success'
        shell: bash
        run: |
          echo "::error::The review job ended with '$REVIEW_RESULT', so there are no findings to check."
          exit 1
      # Base branch only (the default for pull_request_target): the script below must be trusted.
      - if: needs.gate.outputs.state == 'review'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.gate.outputs.state == 'review'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-review-findings
          path: ${{ runner.temp }}
      - name: Post review and apply the severity gate
        if: needs.gate.outputs.state == 'review'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          node scripts/ai-review.mjs "$RUNNER_TEMP/findings.json" "$RUNNER_TEMP/review.json"
          gate=$?
          if [ -f "$RUNNER_TEMP/review.json" ]; then
            gh api "repos/$REPO/pulls/$PR/reviews" --method POST --input "$RUNNER_TEMP/review.json" >/dev/null || exit 1
          fi
          exit $gate
