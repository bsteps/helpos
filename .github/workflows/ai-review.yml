name: AI review

# Independent AI security review for PRs labelled `security` or `area:db` (issue #42).
# The reviewer is Claude on a different model from the one that writes our code (Opus).
# High or critical findings fail the `AI review result` check. Make that check required.
#
# Deliberately simple: plain `pull_request`, so GitHub never gives secrets to fork PRs.
# Only same-repo branches (pushed by maintainers) are reviewed here. Fork and Dependabot PRs
# skip with a notice, and the maintainer runs `/security-review` locally before merging.
# When outside contributors arrive, see PR #58's history for a fork-safe pull_request_target
# version.

on:
  pull_request:
    # unlabeled: removing the label clears the required check instead of leaving it red.
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review result
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - id: gate
        shell: bash
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if ! jq -e 'index("security") or index("area:db")' <<<"$LABELS" >/dev/null; then
            echo "Not labelled security or area:db. No review needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$HEAD_REPO" != "$BASE_REPO" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Fork or Dependabot PR: no secrets here. Maintainer, run /security-review locally before merging."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare diff and prompt
        if: steps.gate.outputs.run == 'true'
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr"
          git diff --no-ext-diff --no-textconv "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/pr/pr.diff"
          {
            echo 'prompt<<PROMPT_EOF'
            cat .github/ai-review/prompt.md
            printf '\nThe PR range is %s...%s. The full diff is %s/pr/pr.diff.\n' "$BASE_SHA" "$HEAD_SHA" "$RUNNER_TEMP"
            echo 'PROMPT_EOF'
            echo "schema=$(jq -c . .github/ai-review/findings.schema.json)"
          } >> "$GITHUB_OUTPUT"
      - id: claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          # Set ONE of these secrets. A Claude Pro/Max subscription works: run `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prep.outputs.prompt }}
          # Read-only reviewer: no shell, no edits, no network. Override the model with the repo variable.
          claude_args: >-
            --model ${{ vars.AI_REVIEW_MODEL || 'claude-sonnet-5-5' }}
            --add-dir ${{ runner.temp }}/pr
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch"
            --json-schema '${{ steps.prep.outputs.schema }}'
      - name: Post review and apply the severity gate
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          printf '%s' "$FINDINGS" > "$RUNNER_TEMP/findings.json"
          node scripts/ai-review.mjs "$RUNNER_TEMP/findings.json" "$RUNNER_TEMP/review.json"
          gate=$?
          if [ -f "$RUNNER_TEMP/review.json" ]; then
            gh api "repos/$REPO/pulls/$PR/reviews" --method POST --input "$RUNNER_TEMP/review.json" >/dev/null || exit 1
          fi
          exit $gate
