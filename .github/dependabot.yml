version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # Stay on TypeScript 6 until TS 7.1 ships a stable JS API (ADR 0002).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types must match the Node major we run (24, see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
