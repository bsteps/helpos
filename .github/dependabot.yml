version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 10
    ignore:
      # Stay on TypeScript 6 until TS 7.1 ships a stable JS API (ADR 0002).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types must match the Node major we run (24, see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Base images in the Dockerfile and the demo compose file, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The Node major must match .nvmrc.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /deploy/demo
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
